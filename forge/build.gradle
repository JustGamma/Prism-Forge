plugins {
    id 'java'
    id 'checkstyle'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.6'
    id 'com.gradleup.shadow' version '9.6.1'
}

base {
    archivesName = 'prism-forge'
}

repositories {
    maven {
        url = uri('https://repo.spongepowered.org/maven/')
        content {
            includeGroup 'org.spongepowered'
        }
    }
}

configurations {
    bundled {
        canBeConsumed = false
    }
    implementation.extendsFrom(bundled)
}

dependencies {
    bundled('org.spongepowered:spongeapi:7.1.0') {
        // Unused world-generation snapshot; Forge already supplies its own ASM implementation.
        exclude group: 'com.flowpowered', module: 'flow-noise'
        exclude group: 'org.ow2.asm'
    }
    bundled 'com.zaxxer:HikariCP:3.4.2'
    bundled 'com.h2database:h2:1.4.197'
    bundled 'mysql:mysql-connector-java:8.0.19'
    bundled 'org.mariadb.jdbc:mariadb-java-client:2.5.4'
    bundled 'org.mongodb:mongo-java-driver:3.10.2'
    bundled 'org.slf4j:slf4j-simple:1.7.25'
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.25.2'
}

sourceSets {
    main.java.srcDir(rootProject.file('src/main/java'))
    test.java.srcDir(rootProject.file('src/test/java'))
    integrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

minecraft {
    // RFG 2.0.6 maps 1.7.10 to Forge 10.13.4.1614 and stable-12 mappings.
    mcVersion.set('1.7.10')
    javaCompatibilityVersion.set(8)
    // The legacy Minecraft SDK uses Java 8, not Prism compilation.
    jvmLanguageVersion.set(JavaLanguageVersion.of(8))
    injectedTags.put('VERSION', project.version.toString())
}

tasks.named('injectTags') {
    outputClassName.set('com.helion3.prism.forge.BuildInfo')
}

// Application and test classes target the production Java 25 runtime. RFG's separate
// Minecraft SDK/launcher source sets retain their own legacy toolchains.
['compileJava', 'compileTestJava', 'compileIntegrationTestJava', 'compileInjectedTagsJava'].each { taskName ->
    tasks.named(taskName, JavaCompile) {
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(25)
        }
        sourceCompatibility = '25'
        targetCompatibility = '25'
        options.release = 25
        options.encoding = 'UTF-8'
        options.deprecation = true
        options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-path', '-Xlint:-processing'])
    }
}

checkstyle {
    toolVersion = '14.4.0'
    configFile = rootProject.file('checkstyle.xml')
    sourceSets = [project.sourceSets.main, project.sourceSets.test, project.sourceSets.integrationTest]
    ignoreFailures = false
}

apply from: rootProject.file('gradle/license-check.gradle')

def gitRevision = providers.gradleProperty('commit').orElse(providers.exec {
    workingDir rootProject.projectDir
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
}.standardOutput.asText.map { it.trim() })
def gitDescription = providers.exec {
    workingDir rootProject.projectDir
    commandLine 'git', 'describe', '--tags', '--always', '--dirty'
}.standardOutput.asText.map { it.trim() }
def buildNumber = providers.gradleProperty('buildNumber').getOrElse('0')
def ciSystem = providers.gradleProperty('ciSystem').getOrElse('unknown')
def buildMetadata = providers.provider {
    [
        'Built-By': System.getProperty('user.name'),
        'Created-By': System.getProperty('java.vm.version') + ' (' + System.getProperty('java.vm.vendor') + ')',
        'Implementation-Title': base.archivesName.get(),
        'Implementation-Version': project.version.toString() + '+' + ciSystem + '-b' + buildNumber + '.git-' + gitRevision.get(),
        'Implementation-Vendor': 'http://helion3.com/',
        'Git-Revision': gitRevision.get(),
        'Git-Describe': gitDescription.get()
    ]
}

tasks.named('processResources') {
    inputs.property 'modVersion', project.version
    filesMatching('mcmod.info') {
        expand(modVersion: project.version)
    }
    from(rootProject.file('LICENSE.txt'))
    from(rootProject.file('LICENSE.txt')) {
        rename { 'LICENSE-prism.txt' }
    }
}

tasks.named('jar') {
    archiveClassifier = 'unbundled-dev'
    manifest.attributes(buildMetadata.get())
}

tasks.named('shadowJar') {
    archiveClassifier = 'dev'
    manifest.attributes(buildMetadata.get())
    configurations = [project.configurations.bundled]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    exclude 'META-INF/services/javax.annotation.processing.Processor'
    // Shading changes jar contents; retain licenses but not the dependencies' jar signatures.
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/INDEX.LIST'
    exclude 'module-info.class', 'META-INF/versions/**/module-info.class'

    // The original build already relocated MongoDB/BSON. Isolate the libraries formerly
    // supplied by Sponge too, rather than replacing Forge's Guava, Gson or logging classes.
    [
        'com.google.common': 'guava',
        'com.google.gson': 'gson',
        'com.google.inject': 'guice',
        'com.github.benmanes.caffeine': 'caffeine',
        'com.typesafe.config': 'typesafe.config',
        'ninja.leaping.configurate': 'configurate',
        'org.yaml.snakeyaml': 'snakeyaml',
        'org.apache.commons.lang3': 'commons.lang3',
        'com.flowpowered.math': 'flow.math',
        'org.slf4j': 'slf4j',
        'com.zaxxer.hikari': 'hikari',
        'org.h2': 'h2',
        'com.mysql': 'mysql',
        'org.mariadb.jdbc': 'mariadb.jdbc',
        'com.mongodb': 'mongodb',
        'org.bson': 'bson',
        'javax.inject': 'inject',
        'org.aopalliance': 'aopalliance'
    ].each { originalPackage, isolatedPackage ->
        relocate originalPackage, "com.helion3.prism.lib.${isolatedPackage}"
    }

    // Keep each dependency's notices separately; root-level names often collide.
    project.configurations.bundled.resolvedConfiguration.resolvedArtifacts.each { artifact ->
        from(zipTree(artifact.file)) {
            include 'LICENSE*', 'NOTICE*', 'COPYING*', 'META-INF/LICENSE*', 'META-INF/NOTICE*'
            into "META-INF/licenses/${artifact.moduleVersion.id.name}-${artifact.moduleVersion.id.version}"
        }
    }
}

tasks.named('reobfJar') {
    setInputJarFromTask(tasks.named('shadowJar'))
}

// Separate test mod, installed only in the disposable server.
tasks.register('recordingProbeDevJar', Jar) {
    archiveBaseName = 'prism-recording-probe'
    archiveClassifier = 'test-only-dev'
    from sourceSets.integrationTest.output
}

tasks.named('reobfRecordingProbeDevJar') {
    archiveClassifier = 'test-only'
    referenceClasspath.from(sourceSets.main.output)
}

tasks.register('recordingProbeJar') {
    group = 'build'
    description = 'Builds the reobfuscated disposable-server recording probe.'
    dependsOn tasks.named('reobfRecordingProbeDevJar')
}

tasks.named('test', Test) {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

publishing {
    publications {
        prismForge(MavenPublication) {
            artifactId = base.archivesName.get()
            artifact(tasks.named('reobfJar'))
            pom {
                name = 'Prism'
                url = 'https://github.com/JustGamma/Prism-Forge'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }
}
